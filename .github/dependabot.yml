version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    groups:
      compatible:
        update-types: [minor, patch]
