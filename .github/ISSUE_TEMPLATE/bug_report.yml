name: Bug report
description: Report a reproducible component or client failure.
labels: ["type:bug", "status:needs-triage"]
body:
  - type: input
    id: package_version
    attributes:
      label: Package version
      placeholder: e.g. 0.2.1, or commit SHA for an unreleased checkout
    validations:
      required: true
  - type: input
    id: convex_version
    attributes:
      label: Convex version
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Convex runtime
      options: [Convex cloud, Self-hosted, Local backend]
    validations:
      required: true
  - type: input
    id: browser_version
    attributes:
      label: Browser and version
      description: Provide when relevant; leave blank if not applicable or unavailable.
    validations:
      required: false
  - type: input
    id: operating_system
    attributes:
      label: Operating system and version
      description: Provide when relevant; leave blank if not applicable or unavailable.
    validations:
      required: false
  - type: input
    id: push_service
    attributes:
      label: Push service
      description: Provide when relevant; for example, the browser vendor's push service. Leave blank if not applicable or unavailable.
    validations:
      required: false
  - type: dropdown
    id: permission_state
    attributes:
      label: Notification permission state
      description: Provide when relevant; leave blank if not applicable or unavailable.
      options: [granted, denied, default, not requested, unknown]
    validations:
      required: false
  - type: dropdown
    id: service_worker_registered
    attributes:
      label: Is the service worker registered?
      description: Provide when relevant; leave blank if not applicable or unavailable.
      options: ["Yes", "No", "Unknown"]
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code or steps that reproduce the issue. Redact sensitive data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Optional logs
      description: Do not include secrets or credentials (including VAPID private keys and auth tokens), full push subscription endpoints or keys, notification contents, recipient data, or personal information.
    validations:
      required: false
  - type: checkboxes
    id: issue_search
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues and discussions.
          required: true
